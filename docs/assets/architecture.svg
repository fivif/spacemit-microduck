<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 376" width="860" height="376" role="img" aria-label="System architecture: the RISC-V board runs the robot runtime and drives the servo bus; the development host runs MuJoCo and training; the two speak over TCP 7801.">
  <title>System architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="376" rx="14" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="859" height="375" rx="14" fill="none" stroke="#1e293b"/>

  <text x="34" y="40" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">System architecture</text>
  <text x="34" y="62" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#94a3b8">One runtime, one policy set — the body is either real servos or a MuJoCo duck.</text>

  <!-- left: the board -->
  <rect x="34" y="84" width="356" height="258" rx="11" fill="#111f36" stroke="#2b4a6f"/>
  <text x="54" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#7dd3fc">Board · SpacemiT K3 / K1 (riscv64)</text>

  <rect x="54" y="128" width="316" height="44" rx="8" fill="#16283f" stroke="#2b4a6f"/>
  <text x="68" y="147" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">robotd</text>
  <text x="68" y="163" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">50 Hz control loop · safety · IPC</text>

  <rect x="54" y="178" width="316" height="44" rx="8" fill="#16283f" stroke="#2b4a6f"/>
  <text x="68" y="197" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">duck-control</text>
  <text x="68" y="213" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">observations · policy · servo bus</text>

  <rect x="54" y="228" width="316" height="44" rx="8" fill="#16283f" stroke="#2b4a6f"/>
  <text x="68" y="247" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">ONNX Runtime</text>
  <text x="68" y="263" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">9 policies · 0.201 ms per inference</text>

  <rect x="54" y="278" width="316" height="44" rx="8" fill="#16283f" stroke="#2b4a6f"/>
  <text x="68" y="297" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Dynamixel bus</text>
  <text x="68" y="313" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">14 servos + IMU · 1 Mbaud</text>

  <!-- right: development host -->
  <rect x="470" y="84" width="356" height="258" rx="11" fill="#1b1533" stroke="#4c3d80"/>
  <text x="490" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#c4b5fd">Development host · x86 / GPU</text>

  <rect x="490" y="128" width="316" height="44" rx="8" fill="#251c45" stroke="#4c3d80"/>
  <text x="504" y="147" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">duck-body</text>
  <text x="504" y="163" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">MuJoCo · 200 Hz physics</text>

  <rect x="490" y="178" width="316" height="44" rx="8" fill="#251c45" stroke="#4c3d80"/>
  <text x="504" y="197" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">microduck_rl</text>
  <text x="504" y="213" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">PPO training · ONNX export</text>

  <rect x="490" y="228" width="316" height="44" rx="8" fill="#251c45" stroke="#4c3d80"/>
  <text x="504" y="247" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">policy set</text>
  <text x="504" y="263" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">9 ONNX + manifest · schema 2</text>

  <rect x="490" y="278" width="316" height="44" rx="8" fill="#251c45" stroke="#4c3d80"/>
  <text x="504" y="297" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">web console</text>
  <text x="504" y="313" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">browser joystick over the same IPC</text>

  <!-- link -->
  <line x1="392" y1="213" x2="468" y2="213" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="430" y="204" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#7dd3fc">TCP</text>
  <text x="430" y="230" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#94a3b8">7801</text>
</svg>
