<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 342" width="860" height="342" role="img" aria-label="K1 against K3: build time, idle loop rate, distance walked and on-board loop rate.">
  <title>K1 against K3</title>

  <rect x="0" y="0" width="860" height="342" rx="14" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="859" height="341" rx="14" fill="none" stroke="#1e293b"/>

  <text x="34" y="40" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">K1 against K3</text>
  <text x="34" y="62" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#94a3b8">Same runtime, same nine policies. What differs is build wall-clock and temperature, not headroom in the loop.</text>

  <!-- legend -->
  <rect x="616" y="30" width="11" height="11" rx="2.5" fill="#38bdf8"/>
  <text x="634" y="40" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#cbd5e1">K3 · 8x X100</text>
  <rect x="726" y="30" width="11" height="11" rx="2.5" fill="#a78bfa"/>
  <text x="744" y="40" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#cbd5e1">K1 · 8x X60</text>

  <!-- 1 build -->
  <text x="34" y="104" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#94a3b8">Build</text>
  <text x="34" y="122" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#64748b">lower is better</text>
  <rect x="34" y="136" width="118" height="22" rx="5" fill="#16283f"/>
  <rect x="34" y="136" width="18" height="22" rx="5" fill="#38bdf8"/>
  <text x="160" y="151" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e2e8f0">6m42s</text>
  <rect x="34" y="166" width="118" height="22" rx="5" fill="#16283f"/>
  <rect x="34" y="166" width="118" height="22" rx="5" fill="#a78bfa"/>
  <text x="160" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e2e8f0">43m39s</text>

  <!-- 2 idle loop rate -->
  <text x="238" y="104" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#94a3b8">Idle loop rate</text>
  <text x="238" y="122" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#64748b">of 50 Hz</text>
  <rect x="238" y="136" width="118" height="22" rx="5" fill="#16283f"/>
  <rect x="238" y="136" width="116" height="22" rx="5" fill="#38bdf8"/>
  <text x="364" y="151" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e2e8f0">49.0</text>
  <rect x="238" y="166" width="118" height="22" rx="5" fill="#16283f"/>
  <rect x="238" y="166" width="118" height="22" rx="5" fill="#a78bfa"/>
  <text x="364" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e2e8f0">50.0</text>

  <!-- 3 distance walked -->
  <text x="442" y="104" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#94a3b8">Distance walked</text>
  <text x="442" y="122" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#64748b">no falls</text>
  <rect x="442" y="136" width="118" height="22" rx="5" fill="#16283f"/>
  <rect x="442" y="136" width="109" height="22" rx="5" fill="#38bdf8"/>
  <text x="568" y="151" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e2e8f0">1.145 m</text>
  <rect x="442" y="166" width="118" height="22" rx="5" fill="#16283f"/>
  <rect x="442" y="166" width="118" height="22" rx="5" fill="#a78bfa"/>
  <text x="568" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e2e8f0">1.245 m</text>

  <!-- 4 on-board loop rate -->
  <text x="646" y="104" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#94a3b8">On-board loop rate</text>
  <text x="646" y="122" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#64748b">body on the board, no tunnel</text>
  <rect x="646" y="136" width="118" height="22" rx="5" fill="#16283f" stroke="#334155" stroke-dasharray="3 3"/>
  <text x="705" y="151" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#64748b">n/a</text>
  <rect x="646" y="166" width="118" height="22" rx="5" fill="#16283f"/>
  <rect x="646" y="166" width="118" height="22" rx="5" fill="#a78bfa"/>
  <text x="772" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#e2e8f0">50.0</text>

  <line x1="34" y1="224" x2="826" y2="224" stroke="#1e293b"/>

  <text x="34" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#94a3b8">K1 builds 6.5x slower because it has 3.8 GiB and no swap — six parallel rustc processes thrash the page cache, not</text>
  <text x="34" y="272" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#94a3b8">because the cores are slow. The earlier 40.7 Hz "under load" figure came from a simulator on another machine,</text>
  <text x="34" y="294" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#94a3b8">reached over an SSH tunnel: one read+write round trip is p50 8.7 ms. Move the body onto the board and the same</text>
  <text x="34" y="316" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">loop holds 50.0 of 50 Hz, 0 missed. 40.7 Hz was the tunnel's ceiling. CPU: K1 50 C, K3 64 C. Inference 0.201 ms.</text>
</svg>
