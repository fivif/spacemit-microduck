<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="K1 against K3: build time, idle loop rate, walking distance and CPU temperature.">
  <rect x="0" y="0" width="860" height="330" rx="14" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="859" height="329" rx="14" fill="none" stroke="#1e293b"/>

  <text x="34" y="42" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">K1 against K3</text>
  <text x="34" y="64" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#94a3b8">Same runtime, same nine policies. The weaker SoC builds slower and has less headroom under load.</text>

  <!-- legend -->
  <rect x="606" y="30" width="11" height="11" rx="2.5" fill="#38bdf8"/>
  <text x="624" y="40" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#cbd5e1">K3 · 8x X100</text>
  <rect x="726" y="30" width="11" height="11" rx="2.5" fill="#a78bfa"/>
  <text x="744" y="40" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#cbd5e1">K1 · 8x X60</text>

  <!-- panel 1: build time -->
  <text x="34" y="110" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#94a3b8">Trimmed build</text>
  <text x="34" y="128" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">lower is better</text>
  <rect x="34" y="140" width="190" height="22" rx="5" fill="#16283f"/>
  <rect x="34" y="140" width="29" height="22" rx="5" fill="#38bdf8"/>
  <text x="72" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e2e8f0">6m42s</text>
  <rect x="34" y="170" width="190" height="22" rx="5" fill="#16283f"/>
  <rect x="34" y="170" width="190" height="22" rx="5" fill="#a78bfa"/>
  <text x="196" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e2e8f0">43m39s</text>

  <!-- panel 2: idle loop -->
  <text x="264" y="110" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#94a3b8">Idle loop rate</text>
  <text x="264" y="128" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">of 50 Hz</text>
  <rect x="264" y="140" width="190" height="22" rx="5" fill="#16283f"/>
  <rect x="264" y="140" width="186" height="22" rx="5" fill="#38bdf8"/>
  <text x="418" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e2e8f0">49.0</text>
  <rect x="264" y="170" width="190" height="22" rx="5" fill="#16283f"/>
  <rect x="264" y="170" width="190" height="22" rx="5" fill="#a78bfa"/>
  <text x="418" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e2e8f0">50.0</text>

  <!-- panel 3: walking -->
  <text x="494" y="110" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#94a3b8">Distance walked</text>
  <text x="494" y="128" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">no falls</text>
  <rect x="494" y="140" width="190" height="22" rx="5" fill="#16283f"/>
  <rect x="494" y="140" width="172" height="22" rx="5" fill="#38bdf8"/>
  <text x="670" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e2e8f0">1.145 m</text>
  <rect x="494" y="170" width="190" height="22" rx="5" fill="#16283f"/>
  <rect x="494" y="170" width="187" height="22" rx="5" fill="#a78bfa"/>
  <text x="670" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e2e8f0">1.245 m</text>

  <!-- panel 4: loaded loop -->
  <text x="724" y="110" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#94a3b8">Under full load</text>
  <text x="724" y="128" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">walking + turning + observer</text>
  <rect x="724" y="140" width="102" height="22" rx="5" fill="#16283f"/>
  <rect x="724" y="140" width="98" height="22" rx="5" fill="#38bdf8"/>
  <text x="700" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e2e8f0" text-anchor="end">47.9</text>
  <rect x="724" y="170" width="102" height="22" rx="5" fill="#16283f"/>
  <rect x="724" y="170" width="83" height="22" rx="5" fill="#fbbf24"/>
  <text x="700" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fbbf24" text-anchor="end">40.7</text>

  <line x1="34" y1="220" x2="826" y2="220" stroke="#1e293b"/>

  <!-- footnotes -->
  <text x="34" y="248" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#94a3b8">K1 builds 6.5x slower because it has 3.8 GiB and no swap — six parallel rustc processes thrash the page cache,</text>
  <text x="34" y="266" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#94a3b8">not because the cores are slow.</text>
  <text x="34" y="292" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#fbbf24">K1 drops below the 45 Hz health floor under load. That is the first measured gap between the two boards.</text>
  <text x="34" y="314" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">CPU temperature: K1 50 C, K3 64 C. Inference: 0.201 ms on K3, 1.01% of the 20 ms tick.</text>
</svg>
